# nginx config for TravelerHub on fozhan.dev
# Place this file at: /etc/nginx/sites-available/travelhub
# Then: ln -s /etc/nginx/sites-available/travelhub /etc/nginx/sites-enabled/
#
# SSL certs are obtained after you place this file:
#   certbot --nginx -d travelhub.fozhan.dev -d travelhub-api.fozhan.dev

# ── travelhub.fozhan.dev — React SPA (static files) ──────────────────────────
server {
    listen 80;
    server_name travelhub.fozhan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name travelhub.fozhan.dev;

    # Certbot fills these in automatically
    ssl_certificate     /etc/letsencrypt/live/travelhub.fozhan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelhub.fozhan.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/travelhub.fozhan.dev;
    index index.html;

    # SPA routing — unknown paths fall back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive cache for hashed assets (Vite adds content hash to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpe?g|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# ── travelhub-api.fozhan.dev — FastAPI backend (Docker on :8000) ──────────────
server {
    listen 80;
    server_name travelhub-api.fozhan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name travelhub-api.fozhan.dev;

    ssl_certificate     /etc/letsencrypt/live/travelhub-api.fozhan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelhub-api.fozhan.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Increase timeouts for AI/LLM routes that can take >30s
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Allow larger uploads (photos, etc.)
    client_max_body_size 25M;
}
