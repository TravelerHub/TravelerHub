name: Deploy TravelerHub

on:
  push:
    branches: [main, deployment]

jobs:
  deploy:
    name: Build & deploy on Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@$SERVER_IP << 'ENDSSH'
            set -e
            cd /opt/travelhub

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Building and starting all containers..."
            docker compose -f docker-compose.prod.yml up --build -d

            echo "==> Waiting for backend to be ready..."
            sleep 10
            curl -sf http://localhost:8000/health \
              || (echo "--- Backend logs ---" && docker logs travelhub-backend --tail 40 && exit 1)

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete ✓"
          ENDSSH
