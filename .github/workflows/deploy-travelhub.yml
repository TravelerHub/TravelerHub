name: Deploy TravelerHub

on:
  push:
    branches: [main, deployment]

jobs:
  deploy:
    name: Build & Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build React frontend ───────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Write frontend env
        working-directory: frontend
        run: echo "${{ secrets.VITE_FRONTEND_ENV }}" > .env.production

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ── 3. SSH setup ──────────────────────────────────────────────────────────
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # ── 4. Deploy frontend (built static files) ───────────────────────────────
      - name: Deploy frontend to server
        run: |
          rsync -avz --delete \
            frontend/dist/ \
            root@${{ secrets.SERVER_IP }}:/var/www/${{ secrets.FRONTEND_DOMAIN }}/

      # ── 5. Deploy backend source code ─────────────────────────────────────────
      - name: Deploy backend to server
        run: |
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.*' \
            backend/ \
            root@${{ secrets.SERVER_IP }}:/opt/travelhub/backend/

      # ── 6. Rebuild Docker image and restart container ─────────────────────────
      - name: Rebuild & restart backend container
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh root@$SERVER_IP << 'ENDSSH'
            set -e
            cd /opt/travelhub

            echo "==> Building Docker image..."
            docker build -t travelhub-backend:latest ./backend

            echo "==> Stopping old container..."
            docker stop travelhub-backend 2>/dev/null || true
            docker rm   travelhub-backend 2>/dev/null || true

            echo "==> Starting new container..."
            docker run -d \
              --restart always \
              --name travelhub-backend \
              -p 127.0.0.1:8001:8000 \
              --env-file /opt/travelhub/.env \
              travelhub-backend:latest

            echo "==> Waiting for startup (up to 60s)..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
                echo "==> Health check passed after $((i*5))s ✓"
                break
              fi
              echo "    ... not ready yet (${i}/12)"
              if [ $i -eq 12 ]; then
                echo "=== Container logs ===" && docker logs travelhub-backend --tail 50
                exit 1
              fi
            done

            echo "==> Pruning old images..."
            docker image prune -f

            echo "==> Deploy complete ✓"
          ENDSSH
