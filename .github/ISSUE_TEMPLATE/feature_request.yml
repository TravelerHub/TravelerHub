name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Tell us about the user pain — not the implementation yet.
      placeholder: |
        On a 6-person trip we constantly debate where to eat. The polls page
        works but doesn't pin votes to a map.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. A rough sketch of what the UI / API could look like.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Frontend only
        - Backend only
        - Both
        - Not sure
    validations:
      required: true
