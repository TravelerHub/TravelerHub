# travelhub.fozhan.dev — serves the React frontend
server {
    listen 80;
    server_name travelhub.fozhan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name travelhub.fozhan.dev;

    ssl_certificate     /etc/letsencrypt/live/travelhub.fozhan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/travelhub.fozhan.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# api.travelhub.fozhan.dev — serves the FastAPI backend
server {
    listen 80;
    server_name api.travelhub.fozhan.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.travelhub.fozhan.dev;

    ssl_certificate     /etc/letsencrypt/live/api.travelhub.fozhan.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.travelhub.fozhan.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Increase for file uploads (receipt scans, gallery photos)
    client_max_body_size 20M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Supabase realtime, map tracking)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
